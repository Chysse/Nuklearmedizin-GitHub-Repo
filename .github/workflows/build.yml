name: Webseite bauen

on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'tools/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Abhängigkeiten installieren
        run: |
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium
          cd tools && npm install

      - name: HTML bauen
        run: python tools/build.py

      - name: Prüfen (Sprungziele, Formeln)
        run: python tools/check.py

      - name: EPUB bauen
        run: cd tools && python build_epub.py

      - name: PDF bauen
        run: python tools/build_pdf.py

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Nuklearmedizin-${{ github.run_number }}
          path: |
            build/Nuklearmedizin.html
            build/Nuklearmedizin.pdf
            build/Nuklearmedizin.epub
          retention-days: 90

